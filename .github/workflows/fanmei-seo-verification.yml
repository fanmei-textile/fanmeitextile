name: Fanmei SEO patch verification
on:
  push:
    branches: [codex/fanmei-seo-verification]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply existing patch to the full source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = f6b8beadf4d08eac495dee34b9796b1821eecbc1
          test -z "$(git status --porcelain)"
          echo '' | base64 --decode > "$RUNNER_TEMP/fanmei-seo.patch"
          sha256sum "$RUNNER_TEMP/fanmei-seo.patch"
          git apply --index --check "$RUNNER_TEMP/fanmei-seo.patch"
          git apply --index "$RUNNER_TEMP/fanmei-seo.patch"
          git diff --cached --check
          git diff --cached --stat
          git write-tree
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Production build
        run: pnpm build
      - name: Check HTTP, sitemap, canonical and robots
        shell: bash
        run: |
          set -euo pipefail
          pnpm start --hostname 127.0.0.1 > "$RUNNER_TEMP/fanmei-next.log" 2>&1 &
          trap 'cat "$RUNNER_TEMP/fanmei-next.log"' EXIT
          for n in {1..35}; do
            if curl -fsS http://127.0.0.1:3000/robots.txt > "$RUNNER_TEMP/fanmei-robots.txt"; then break; fi
            sleep 1
          done
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          const origin = 'http://127.0.0.1:3000'
          const canonicalOrigin = 'https://www.fanmeitextile.com'
          const sitemap = await fetch(origin + '/sitemap.xml')
          assert.equal(sitemap.status, 200)
          assert.match(sitemap.headers.get('content-type'), /xml/)
          const xml = await sitemap.text()
          assert.doesNotMatch(xml, /<lastmod>/i)
          const urls = [...xml.matchAll(/<loc>([^<]+)<\/loc>/g)].map(match => new URL(match[1]))
          assert.ok(urls.length >= 15)
          assert.equal(new Set(urls.map(url => url.href)).size, urls.length)
          for (const url of urls) {
            assert.equal(url.origin, canonicalOrigin)
            const response = await fetch(origin + url.pathname, { redirect: 'manual' })
            assert.equal(response.status, 200, url.pathname)
            assert.doesNotMatch(response.headers.get('x-robots-tag') ?? '', /noindex/i)
            const html = await response.text()
            assert.doesNotMatch(html, /<meta[^>]+name="robots"[^>]+content="[^"]*noindex/i)
            const canonical = new URL(canonicalOrigin + (url.pathname === '/' ? '' : url.pathname))
            const rawCanonical = html.match(/<link[^>]+rel="canonical"[^>]+href="([^"]+)"/i)?.[1]
            assert.ok(rawCanonical, url.pathname)
            assert.equal(new URL(rawCanonical).href, canonical.href)
            assert.match(html, /<h1(?:[ >])/)
            console.log('PASS', url.pathname, response.status, rawCanonical)
          }
          const robots = await fetch(origin + '/robots.txt')
          assert.equal(robots.status, 200)
          const text = await robots.text()
          assert.ok(text.includes(canonicalOrigin + '/sitemap.xml'))
          assert.doesNotMatch(text, /Disallow:\s*\/\s*$/im)
          JS
      - name: Check desktop, mobile and inquiry interactions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fanmei-browser"
          npm install --prefix "$RUNNER_TEMP/fanmei-browser" --no-audit --no-fund playwright
          "$RUNNER_TEMP/fanmei-browser/node_modules/.bin/playwright" install --with-deps chromium
          pnpm start --hostname 127.0.0.1 --port 3001 > "$RUNNER_TEMP/fanmei-browser.log" 2>&1 &
          trap 'cat "$RUNNER_TEMP/fanmei-browser.log"' EXIT
          for n in {1..35}; do
            if curl -fsS http://127.0.0.1:3001/robots.txt > /dev/null; then break; fi
            sleep 1
          done
          cd "$RUNNER_TEMP/fanmei-browser"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { chromium } from 'playwright'
          const origin = 'http://127.0.0.1:3001'
          const xml = await (await fetch(origin + '/sitemap.xml')).text()
          const paths = [...xml.matchAll(/<loc>([^<]+)<\/loc>/g)]
            .map(match => new URL(match[1]).pathname)
            .filter(path => /^\/(?:$|products|contact|guides|about|factory|rfq)/.test(path))
          const browser = await chromium.launch({ args: ['--disable-external-intent-requests'] })
          try {
            for (const viewport of [{ width: 1440, height: 900 }, { width: 390, height: 844 }]) {
              const context = await browser.newContext({ viewport, serviceWorkers: 'block' })
              await context.route('**/*', route => route.request().url().startsWith(origin + '/') ? route.continue() : route.abort())
              await context.addInitScript(() => {
                window.open = url => {
                  window.__fanmeiCapturedWhatsApp = String(url)
                  return null
                }
              })
              const page = await context.newPage()
              for (const path of paths) {
                const response = await page.goto(origin + path, { waitUntil: 'load' })
                assert.equal(response.status(), 200, path)
                assert.equal(await page.locator('h1').count(), 1, path)
                await page.locator('main img').evaluateAll(images => {
                  for (const image of images) image.loading = 'eager'
                })
                await page.waitForFunction(() => [...document.querySelectorAll('main img')].every(img => img.complete && img.naturalWidth > 0), { }, { timeout: 15000 })
                assert.ok(await page.evaluate(() => document.documentElement.scrollWidth <= innerWidth + 1), 'Horizontal overflow at ' + path)
                console.log('PASS', viewport.width, path, 'images', await page.locator('main img').count())
              }
              const series = paths.find(path => path.endsWith('/sl2788'))
              assert.ok(series)
              await page.goto(origin + series)
              const rfqHref = await page.locator('main a[href^="/rfq?product="]').first().getAttribute('href')
              const choice = new URL(rfqHref, origin).searchParams.get('product')
              await page.goto(origin + rfqHref)
              const form = page.locator('main form')
              const hydratedChoice = await form.locator('[name=product]').inputValue()
              assert.equal(hydratedChoice, choice)
              for (const [name, value] of Object.entries({ name: 'SEO Test', company: 'Test Vendor', country: 'Test Country', email: 'seo-test@example.invalid', quantity: '15000' })) {
                await form.locator('[name=' + name + ']').fill(value)
              }
              await form.locator('[name=application]').selectOption('Sofa / recliner')
              await form.getByRole('button', { name: 'Get Factory FOB Quote' }).click()
              const whatsapp = new URL(await page.evaluate(() => window.__fanmeiCapturedWhatsApp))
              assert.equal(whatsapp.hostname, 'wa.me')
              assert.ok(whatsapp.searchParams.get('text').includes(choice))
              assert.ok(whatsapp.searchParams.get('text').includes('seo-test@example.invalid'))
              const session = await context.newCDPSession(page)
              await session.send('Page.enable')
              const emailIntent = new Promise(resolve => session.on('Page.frameRequestedNavigation', event => {
                if (event.url.startsWith('mailto:')) resolve(event.url)
              }))
              await form.getByRole('button', { name: 'Prepare Email RFQ' }).click()
              const email = await Promise.race([emailIntent, new Promise(resolve => setTimeout(resolve, 3000, ''))])
              assert.ok(email, 'Expected a browser mailto navigation intent')
              assert.ok(new URL(email).searchParams.get('body').includes(choice))
              console.log('PASS', viewport.width, 'RFQ selection and intercepted WhatsApp and email intents')
              await context.close()
            }
          } finally {
            await browser.close()
          }
          JS
